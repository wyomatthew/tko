[package]
name = "tko"
version = "0.1.0"
edition = "2024"
description = "A ticket management CLI backed by git-service issue trackers"
license = "MIT"
repository = "https://github.com/radutopala/tko"

[[bin]]
name = "tko"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
